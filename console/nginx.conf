server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The console is a static SPA. It never needs inline scripts, framing, or cross-origin calls.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Same-origin API: the harness has no CORS on purpose. SSE needs buffering off and a long read timeout.
  location /v1/ {
    proxy_pass http://harness:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location ~ ^/(healthz|readyz|metrics)$ {
    proxy_pass http://harness:8080;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y; # content-hashed filenames
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
