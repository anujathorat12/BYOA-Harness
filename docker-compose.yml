# docker compose up --build
services:
  runtime-image:            # builds the sandbox image every agent runs in, then exits
    build: ./runtime
    image: byoa-runtime:latest
    entrypoint: ["true"]
    restart: "no"

  socket-proxy:             # least-privilege Docker API: container lifecycle only, no images/networks/volumes/exec/build.
                            # It cannot restrict create-time flags (e.g. privileged): the harness is trusted code that
                            # builds every container config itself. See docs/OPERATIONS.md, limitation 2.
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 1
      VERSION: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SECRETS: 0
      SERVICES: 0
      SYSTEM: 0
      INFO: 0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [control]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: harness
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  harness:
    build: .
    depends_on:
      db: { condition: service_healthy }
      socket-proxy: { condition: service_started }
      runtime-image: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql+psycopg://harness:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/harness
      DOCKER_HOST: tcp://socket-proxy:2375
      SANDBOX_IMAGE: byoa-runtime:latest
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      EXTRA_CA_BUNDLE: ${EXTRA_CA_BUNDLE:-}
      MAX_CONCURRENT_SESSIONS: 8
      HARNESS_API_KEYS: '{"${ADMIN_KEY:?set ADMIN_KEY in .env}":{"name":"admin","roles":["admin"]},"${DEV_KEY:?set DEV_KEY in .env}":{"name":"alice","roles":["developer"]},"${APPROVER_KEY:?set APPROVER_KEY in .env}":{"name":"bob","roles":["approver"]},"${AUDITOR_KEY:?set AUDITOR_KEY in .env}":{"name":"audrey","roles":["auditor"]}}'
    volumes: ["./certs:/certs:ro"]   # optional extra CA roots (see README: corporate TLS inspection)
    ports: ["8080:8080"]
    networks: [control]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  console:                  # operator console: static SPA + same-origin reverse proxy to the harness API
    build:
      context: .
      dockerfile: console/Dockerfile
    depends_on:
      harness: { condition: service_started }
    ports: ["8081:8080"]
    networks: [control]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  control: {}
volumes:
  pgdata: {}
