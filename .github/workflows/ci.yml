name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts runtime
      - name: Build sandbox runtime image
        run: docker build -t byoa-runtime:latest runtime
      - name: Unit + integration + adversarial (real sandbox)
        run: pytest -q --cov=byoa_harness --cov-report=term
      - name: OpenAPI is up to date
        run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - name: Compose builds
        run: docker compose --env-file .env.example build
  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: console/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build   # tsc --strict + production build
